{% extends "base.html" %}
{% block title %}Create an account — LearnHub{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card"><div class="auth-mark">L</div><div class="eyebrow">YOUR NEXT CHAPTER</div><h1>Start with a<br><span>little curiosity.</span></h1><p class="muted">Create a free account and build your own learning path.</p><form method="post" class="auth-form"><label>Full name<input type="text" name="name" placeholder="Your name" required maxlength="100" autocomplete="name"></label><label>Email address<input type="email" name="email" placeholder="you@example.com" required maxlength="150" autocomplete="email"></label><label>Password<input type="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password"></label><button class="btn btn-full" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></section>
{% endblock %}
