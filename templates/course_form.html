{% extends "base.html" %}
{% block title %}Add a course — LearnHub{% endblock %}
{% block content %}
<section class="auth-section course-form-section"><div class="auth-card form-wide"><a class="back-link" href="{{ url_for('admin') }}">← Admin dashboard</a><div class="eyebrow">COURSE BUILDER</div><h1>Add a <span>new course.</span></h1><p class="muted">Add course information and put each lesson title on a new line.</p><form method="post" class="auth-form"><label>Course title<input name="title" required maxlength="180" placeholder="e.g. JavaScript Essentials"></label><label>URL slug<input name="slug" required maxlength="200" placeholder="javascript-essentials"><small>Use lowercase letters and hyphens.</small></label><div class="form-two"><label>Category<input name="category" required placeholder="Web Development"></label><label>Instructor<input name="instructor" required placeholder="Instructor name"></label></div><div class="form-two"><label>Level<select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label>Duration<input name="duration" value="4 weeks" required></label></div><label>Course description<textarea name="description" rows="4" required placeholder="What will students learn?"></textarea></label><label>Image URL (optional)<input type="url" name="image_url" placeholder="https://..."></label><label>Lesson titles<textarea name="lessons" rows="6" placeholder="Introduction&#10;Core concepts&#10;Practice exercise"></textarea><small>One lesson title per line.</small></label><label class="check-label"><input type="checkbox" name="featured"> Feature this course on the home page</label><button class="btn btn-full" type="submit">Create course ↗</button></form></div></section>
{% endblock %}
